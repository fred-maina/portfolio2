<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#efeee8" />
    <script>document.documentElement.classList.add('js')</script>
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <link rel="canonical" href="https://www.fredmaina.com/" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/instrument-serif-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-medium.woff2" as="font" type="font/woff2" crossorigin />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="{{name}}" />
    <meta property="og:title" content="{{ogTitle}}" />
    <meta property="og:description" content="{{ogDescription}}" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://www.fredmaina.com/" />
    <meta property="og:site_name" content="{{name}}" />
    <meta property="og:image" content="https://www.fredmaina.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ogImageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ogTitle}}" />
    <meta name="twitter:description" content="{{twitterDescription}}" />
    <meta name="twitter:image" content="https://www.fredmaina.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="{{ogImageAlt}}" />
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/site.css" />
    <script type="application/ld+json">{{structuredData}}</script>
  </head>
  <body>
    {{siteContent}}
    <script type="module" src="/src/site.js"></script>
  </body>
</html>
